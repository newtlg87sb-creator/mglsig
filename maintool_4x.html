<body class="bg-brand-dark text-white font-inter flex flex-col min-h-screen">
    <script src="/static/js/header.js"></script>
    <main class="chart-page">
      <h1 class="sr-only">Зах зээлийн график</h1>
      <div class="chart-app">
        <section id="chart-settings" class="toolbar" aria-label="Графикийн тохиргоо">
            <select id="market" aria-label="Зах зээл" title="Зах зээл">
                <option value="spot">Spot</option>
                <option value="futures">Futures</option>
            </select>
            <input id="symbol" type="text" value="BTCUSDT" list="symbol-suggestions" maxlength="20"
                autocomplete="off" spellcheck="false" aria-label="Хослол" title="Хослол">
            <datalist id="symbol-suggestions"></datalist>
            <select id="interval" aria-label="Хугацаа" title="Хугацаа">
                <option value="1m">1m</option>
                <option value="3m">3m</option>
                <option value="5m">5m</option>
                <option value="15m">15m</option>
                <option value="30m">30m</option>
                <option value="1h">1h</option>
                <option value="2h">2h</option>
                <option value="4h">4h</option>
                <option value="6h">6h</option>
                <option value="12h">12h</option>
                <option value="1d">1d</option>
                <option value="1w">1w</option>
                <option value="1M">1M</option>
            </select>
            <label class="indicator-period" title="RSI Period">
                P <input id="rsiPeriod" type="number" min="1" max="500" value="14" aria-label="RSI Period">
            </label>
            <button id="reload" type="button" aria-label="Шинэчлэх" title="Шинэчлэх">↻</button>
        </section>

        <div class="status-row" aria-label="Графикийн төлөв">
            <span class="countdown"><span>Дараагийн лаа</span> <b id="candle-countdown">--:--</b></span>
            <span id="symbols-status" class="symbols-status" role="status" aria-live="polite"></span>
            <span id="volume-profile-status" class="symbols-status" role="status" aria-live="polite"></span>
            <span id="status" class="status" role="status" aria-live="polite">График ачаалж байна...</span>
        </div>
        <section class="chart-frame" aria-label="Үнийн лаан график">
            <div class="chart-topbar">
                <div class="ohlc" aria-label="Лааны O H L C үнэ" aria-live="polite">
                    <span id="ohlc-symbol">BTCUSDT</span>
                    <span><b>O</b> <span id="ohlc-open">—</span></span>
                    <span><b>H</b> <span id="ohlc-high">—</span></span>
                    <span><b>L</b> <span id="ohlc-low">—</span></span>
                    <span><b>C</b> <span id="ohlc-close">—</span></span>
                </div>
                <div class="chart-panel-toggles" role="group" aria-label="Тохиргооны хэсгүүд">
                    <button class="chart-panel-toggle" id="toggle-chart-settings" type="button"
                        aria-controls="chart-settings" aria-expanded="true">Chart Set</button>
                    <button class="chart-panel-toggle indicator-set-toggle" id="toggle-indicator-settings" type="button"
                        aria-controls="indicator-settings" aria-expanded="false">Indicator Set</button>
                </div>
            </div>
            <canvas id="chart" role="img" aria-label="BTCUSDT үнийн график"></canvas>
        </section>
      </div>
    </main>
