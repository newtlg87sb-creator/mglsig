<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/chart_style.css">
    <title>Binance Chart</title>
</head>
<body>
    
    <!-- Top Bar (Header & Controls) -->
    <div class="section-title chart-title">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-weight: bold; font-size: 14px; letter-spacing: 1px;">CHART</span>
            
            <select id="market" class="chart-interval-select">
                <option value="spot" selected>SPOT</option>
                <option value="futures">FUTURES</option>
            </select>

            <input type="text" id="coin" value="BTCUSDT" list="coinList" class="chart-coin-input" placeholder="BTCUSDT">
            <datalist id="coinList"></datalist>
        </div>

        <div class="chart-tools">
            <span id="candleCountdown" style="color: #00bcd4; font-family: monospace; font-size: 11px; margin-right: 8px;">--:--</span>
            
            <label for="interval" class="chart-interval-label">TIME:</label>
            <select id="interval" class="chart-interval-select">
                <option value="1s">1s</option>
                <option value="1m" selected>1m</option>
                <option value="5m">5m</option>
                <option value="15m">15m</option>
                <option value="1h">1h</option>
                <option value="4h">4h</option>
                <option value="1d">1d</option>
            </select>

            <button id="toggleChartSettings" class="chart-tool" aria-expanded="false">⚙️</button>
        </div>
    </div>

    <!-- Индикатор тохиргооны самбар -->
    <div id="chartSettings" class="chart-settings" style="display: none;">
        <div class="chart-setting-group">
            <label><input type="checkbox" id="showMACD" checked> MACD</label>
            <label><input type="checkbox" id="showRSI" checked style="margin-left: 8px;"> RSI</label>
        </div>
        <div class="chart-setting-group">
            <label>RSI:</label> <input type="number" id="rsiPeriod" value="14" style="width: 40px;">
        </div>
        <div class="chart-setting-group">
            <label>MACD:</label> 
            <input type="number" id="macdFast" value="12" style="width: 32px;">/
            <input type="number" id="macdSlow" value="26" style="width: 32px;">/
            <input type="number" id="macdSignal" value="9" style="width: 32px;">
        </div>
        <button id="applyIndicators" style="background: #00bcd4; border: none; color: #07090d; padding: 3px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;">Apply</button>
    </div>

    <!-- Чартын үндсэн контейнер -->
    <div id="metaChartContainer"></div>
    
    <!-- Scripts -->
    <script src="/api/Metachart.js"></script>
</body>
</html>
