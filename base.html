
{% load static %}
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="{% block og_title %}MGL Signal - Premium Trading Signals{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Get live crypto and forex trading signals from MGL Signal.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://mglsignal.com/static/new/images/logogo1.png{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://mglsignal.com/{% endblock %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    
    <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
    <link rel="canonical" href="{% block canonical %}https://mglsignal.com/{% endblock %}">

    <meta name="description" content="{% block description %}Get live, accurate crypto and forex trading signals from MGL Signal. Join thousands of traders using our free and premium signals for Binance, stocks, and more.{% endblock %}">
    <title>{% block title %}MGL Signal | Crypto & Forex Signals{% endblock %}</title>

    

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}MGL Signal - Premium Trading Signals{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Accurate crypto and forex trading signals from MGL Signal.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}https://mglsignal.com/static/new/images/logogo1.png{% endblock %}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta name="theme-color" content="#05070a">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q1FKYGV6Z1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Q1FKYGV6Z1');
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            'dark': '#05070a',
                            'dark-blue': '#0f1217',
                            'gold': '#c5a059',
                            'border': '#1f242d'
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Structured Data -->
    {% block schema %}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MGL Signal",
        "url": "https://mglsignal.com",
        "publisher": {
            "@type": "Organization",
            "name": "MGL Signal",
            "logo": {
                "@type": "ImageObject",
                "url": "https://mglsignal.com/static/new/images/logogo1.png"
            }
        }
    }
    </script>
    {% endblock %}

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'main_style.css' %}">

    <!-- Page-specific CSS / Head -->
    {% block extra_head %}{% endblock %}

</head>

<body class="bg-brand-dark text-white font-inter">

    {% block body_content %}{% endblock %}

    {% block scripts %}{% endblock %}

</body>
</html>
