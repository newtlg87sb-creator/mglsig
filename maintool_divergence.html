                function calculateRSI(closes, period = 14) {
                    const rsi = new Array(closes.length).fill(null);
                    if (closes.length <= period) return rsi;
                    let gains = 0, losses = 0;
                    for (let i = 1; i <= period; i++) {
                        const change = closes[i] - closes[i - 1];
                        if (change >= 0) gains += change; else losses -= change;
                    }
                    let avgGain = gains / period, avgLoss = losses / period;
                    rsi[period] = 100 - 100 / (1 + (avgLoss === 0 ? 100 : avgGain / avgLoss));
                    for (let i = period + 1; i < closes.length; i++) {
                        const change = closes[i] - closes[i - 1];
                        avgGain = (avgGain * (period - 1) + (change > 0 ? change : 0)) / period;
                        avgLoss = (avgLoss * (period - 1) + (change < 0 ? -change : 0)) / period;
                        rsi[i] = 100 - 100 / (1 + (avgLoss === 0 ? 100 : avgGain / avgLoss));
                    }
                    return rsi;
                }

                function findPivots(data, lookback) {
                    const highs = [], lows = [];
                    if (!data || data.length < lookback * 2 + 1) return { highs, lows };
                    for (let i = lookback; i < data.length - lookback; i++) {
                        const window = data.slice(i - lookback, i + lookback + 1);
                        if (window.every(val => val === null || data[i] >= val) && data[i] !== null) highs.push({ index: i, value: data[i] });
                        if (window.every(val => val === null || data[i] <= val) && data[i] !== null) lows.push({ index: i, value: data[i] });

                    return { highs, lows };
                }
