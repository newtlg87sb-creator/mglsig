    <script>
        const newsTranslationCache = new Map();
        const maxTranslationChunkLength = 1200;
        const newsPreviewLength = 500;

        function escapeNewsHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        async function translateText(text, targetLang = 'mn') {
            if (!text || targetLang === 'en') return text || '';
            const cacheKey = `${targetLang}:${text}`;
            if (newsTranslationCache.has(cacheKey)) return newsTranslationCache.get(cacheKey);

            const chunks = [];
            let remaining = text;
            while (remaining.length > maxTranslationChunkLength) {
                let splitAt = remaining.lastIndexOf(' ', maxTranslationChunkLength);
                if (splitAt <= 0) splitAt = maxTranslationChunkLength;
                chunks.push(remaining.slice(0, splitAt));
                remaining = remaining.slice(splitAt).trimStart();
            }
            if (remaining) chunks.push(remaining);

            const translatedChunks = [];
            for (const chunk of chunks) {
                try {
                    const response = await fetch(
                        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(chunk)}`,
                        { signal: AbortSignal.timeout(10000) }
                    );
                    if (!response.ok) throw new Error(`Translation service returned HTTP ${response.status}`);
                    const data = await response.json();
                    if (!Array.isArray(data[0])) throw new Error('Translation service returned an invalid response');
                    translatedChunks.push(data[0].map(item => item[0]).join(''));
                } catch (error) {
                    console.warn('News text translation failed; showing the original segment:', error);
                    translatedChunks.push(chunk);
                }
            }

            const translatedText = translatedChunks.join(' ');
            newsTranslationCache.set(cacheKey, translatedText);
            return translatedText;
        }

        let cryptoNewsItems = null;
        let newsRenderVersion = 0;
        let renderedNewsItems = [];

        async function renderCryptoNews() {
            if (!cryptoNewsItems) return;
            const container = document.getElementById('crypto-news-container');
            const lang = localStorage.getItem('lang') || 'mn';
            const renderVersion = ++newsRenderVersion;
            const readMoreBtnText = lang === 'mn' ? 'Дэлгэрэнгүй' : 'Read More';
            const sourceText = lang === 'mn' ? 'Эх сурвалж' : 'Source';

            renderedNewsItems = cryptoNewsItems.map(news => {
                const previewSource = (news.body || '').slice(0, newsPreviewLength);
                return {
                    news,
                    displayTitle: news.title || '',
                    displayPreview: `${previewSource}${(news.body || '').length > newsPreviewLength ? '…' : ''}`,
                    fullBody: null,
                    expanded: false
                };
            });

            container.innerHTML = '';
            renderedNewsItems.forEach((item, index) => {
                const news = item.news;
                const date = new Date(news.published_on * 1000).toLocaleDateString(lang === 'mn' ? 'mn-MN' : 'en-US');
                const category = escapeNewsHtml((news.categories || '').split('|')[0]);
                const articleUrl = /^https:\/\/[^\s]+$/i.test(news.url || '') ? news.url : 'main_news.html';
                const imageUrl = /^https:\/\/[^\s]+$/i.test(news.imageurl || '')
                    ? news.imageurl
                    : 'https://via.placeholder.com/300x170?text=No+Image';
                const html = `
                    <article class="bg-brand-dark-blue border border-brand-border rounded-xl overflow-hidden hover:border-brand-gold/50 transition duration-300 group flex flex-col h-full relative">
                        <div class="aspect-video w-full overflow-hidden relative bg-gray-800">
                            <img src="${escapeNewsHtml(imageUrl)}" alt="News Image" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 opacity-80 group-hover:opacity-100" onerror="this.src='https://via.placeholder.com/300x170?text=No+Image'">
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <div class="flex items-center space-x-2 mb-3 h-4 min-h-4 overflow-hidden">
                                <span class="text-[10px] text-brand-gold font-bold uppercase tracking-wider truncate">${category}</span>
                                <span class="text-[10px] text-gray-600">•</span>
                                <span class="text-[10px] text-gray-500 font-mono whitespace-nowrap">${escapeNewsHtml(date)}</span>
                            </div>
                            <h3 data-news-title="${index}" class="text-white font-bold text-sm mb-3 h-10 line-clamp-2 leading-relaxed group-hover:text-brand-gold transition">${escapeNewsHtml(item.displayTitle)}</h3>
                            <p id="news-body-${index}" data-news-body="${index}" class="text-gray-400 text-xs mb-4 h-52 overflow-hidden flex-grow-0 leading-relaxed whitespace-pre-line">${escapeNewsHtml(item.displayPreview)}</p>
                            <div class="mt-auto flex items-center justify-between gap-3">
                                <button type="button" data-news-index="${index}" aria-expanded="false" aria-controls="news-body-${index}" class="text-brand-gold text-[10px] font-black uppercase tracking-widest hover:text-white transition">
                                    ${readMoreBtnText} <i class="fas fa-chevron-down ml-1"></i>
                                </button>
                                <a href="${escapeNewsHtml(articleUrl)}" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-white text-[10px] uppercase tracking-wider">${sourceText}</a>
                            </div>
                        </div>
                    </article>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            if (lang !== 'mn') return;
            const translatedItems = await mapWithConcurrency(renderedNewsItems, 3, async item => {
                const title = await translateText(item.news.title || '', 'mn');
                const previewSource = (item.news.body || '').slice(0, newsPreviewLength);
                const preview = await translateText(previewSource, 'mn');
                return {
                    title,
                    preview: `${preview}${(item.news.body || '').length > newsPreviewLength ? '…' : ''}`
                };
            });

            if (renderVersion !== newsRenderVersion) return;
            translatedItems.forEach((translation, index) => {
                const item = renderedNewsItems[index];
                item.displayTitle = translation.title;
                item.displayPreview = translation.preview;
                const title = container.querySelector(`[data-news-title="${index}"]`);
                const body = container.querySelector(`[data-news-body="${index}"]`);
                if (title) title.textContent = translation.title;
                if (body && !item.expanded) body.textContent = translation.preview;
            });
        }

        async function mapWithConcurrency(items, limit, mapper) {
            const results = new Array(items.length);
            let nextIndex = 0;
            const workerCount = Math.min(limit, items.length);
            await Promise.all(Array.from({ length: workerCount }, async () => {
                while (nextIndex < items.length) {
                    const index = nextIndex++;
                    results[index] = await mapper(items[index], index);
                }
            }));
            return results;
        }

        document.getElementById('crypto-news-container').addEventListener('click', async event => {
            const button = event.target.closest('button[data-news-index]');
            if (!button) return;

            const index = Number(button.dataset.newsIndex);
            const item = renderedNewsItems[index];
            const body = document.querySelector(`[data-news-body="${index}"]`);
            if (!item || !body) return;

            const lang = localStorage.getItem('lang') || 'mn';
            if (item.expanded) {
                item.expanded = false;
                body.textContent = item.displayPreview;
                body.classList.add('h-52', 'overflow-hidden');
                button.setAttribute('aria-expanded', 'false');
                button.innerHTML = `${lang === 'mn' ? 'Дэлгэрэнгүй' : 'Read More'} <i class="fas fa-chevron-down ml-1"></i>`;
                return;
            }

            button.disabled = true;
            button.textContent = lang === 'mn' ? 'Орчуулж байна...' : 'Translating...';
            const sourceBody = item.news.body || '';
            item.fullBody = lang === 'mn' ? await translateText(sourceBody, 'mn') : sourceBody;
            item.expanded = true;
            body.textContent = item.fullBody;
            body.classList.remove('h-52', 'overflow-hidden');
            button.disabled = false;
            button.setAttribute('aria-expanded', 'true');
            button.innerHTML = `${lang === 'mn' ? 'Хураах' : 'Show Less'} <i class="fas fa-chevron-up ml-1"></i>`;
        });

        // Custom Script to fetch Crypto News
        async function fetchCryptoNews() {
            const container = document.getElementById('crypto-news-container');
            try {
                // API түлхүүрийг нуухын тулд сервер талын proxy ашиглана
                const response = await fetch('/api/news');
                if (!response.ok) throw new Error(`News service returned HTTP ${response.status}`);
                const data = await response.json();
                
                // More robust check for API errors or empty data
                if (data.Response === 'Error' || !Array.isArray(data.Data) || data.Data.length === 0) {
                    console.error('CryptoCompare API Error:', data.Message || 'No news data returned');
                    container.innerHTML = `<div class="col-span-full text-center text-yellow-500/80 p-8 bg-yellow-900/10 border border-yellow-500/20 rounded-lg text-sm" data-i18n="news-error">Мэдээлэл авахад алдаа гарлаа.</div>`;
                    return;
                }

                cryptoNewsItems = data.Data.slice(0, 30);
                await renderCryptoNews();

            } catch (error) {
                console.error('Error fetching news:', error);
                container.innerHTML = '<div class="col-span-full text-center text-red-500 p-8 bg-red-900/10 border border-red-500/20 rounded-lg text-sm">Could not connect to the news service. Please check your network connection.</div>';
            }
        }

        // Run fetch on load
        fetchCryptoNews();

        // Хэл солигдох үед мэдээг дахин татаж орчуулах
        const originalChangeLang = window.changeLang;
        window.changeLang = function(lang) {
            if (originalChangeLang) originalChangeLang(lang);
            if (cryptoNewsItems) renderCryptoNews();
            else {
                document.getElementById('crypto-news-container').innerHTML = `<div class="col-span-full text-center py-12 text-gray-500"><i class="fas fa-circle-notch fa-spin mr-2"></i> ...</div>`;
                fetchCryptoNews();
            }
        };

        // 🚨 ЗАСВАР: Давхардсан changeLang функцийг устгаж, global функцийг ашигладаг болов

        const mobileMenuButton = document.querySelector('.mobile-menu-button');
        const mobileMenu = document.querySelector('.mobile-menu');
        if(mobileMenuButton) {
            mobileMenuButton.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
        }
    </script>
