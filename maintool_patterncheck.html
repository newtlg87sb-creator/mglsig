/* ===== inlined chart_style.css ===== */
:root {
    color-scheme: dark;
    font-family: Inter, "Segoe UI", Arial, sans-serif;

* {

}

body {

.chart-page {

    padding: 96px 16px 16px;
}

.chart-app {

    flex-direction: column;

.toolbar {

.trade-settings {

.indicator-toggle,

.status {

.ohlc {

.chart-topbar {

.chart-panel-toggles {

.chart-app .chart-panel-toggle {

}

.chart-app .chart-panel-toggle[aria-expanded="false"] {

}

.chart-app .chart-panel-toggle.indicator-set-toggle {
    border-color: #c5a059;

    color: #080b10;

.chart-app .chart-panel-toggle.indicator-set-toggle[aria-expanded="true"] {

}

.toolbar[hidden],
.indicator-settings[hidden],
.trade-settings[hidden] {

}

.ohlc span {

}

.ohlc b {

}

.ohlc [data-value="up"] {

}

.ohlc [data-value="down"] {
    color: #ff6874;
}

.chart-frame {
    position: relative;
    flex: 1 1 auto;
    min-height: 220px;
    overflow: hidden;
    border: 1px solid #222b38;
    border-radius: 10px;
    background: #080b10;
}

.chart-frame canvas {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
    touch-action: none;
}

@media (max-width: 640px) {
    .chart-page {
        padding: 88px 8px 12px;

    .toolbar {
        gap: 2px;
        padding: 5px;
    }

    .indicator-settings {
        gap: 4px;
        padding: 5px;
    }

    .chart-frame {
        min-height: 200px;
    }

    .ohlc {
        gap: 4px;
        font-size: 7px;
    }

    .chart-topbar {
        right: 6px;
        left: 6px;
        gap: 4px;
    }

    .chart-app .chart-panel-toggle {
        padding: 0 5px;

    }
}

@media (max-width: 380px) {
    #ohlc-symbol {
        display: none;
    }

    .indicator-settings {
        gap: 4px;
        padding: 5px;
    }
}

/* ===== single-file base reset (replaces site main_style.css) ===== */
html, body { margin: 0; padding: 0; }
body {
    background: #05070a;
    color: #e6edf5;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}
.sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.chart-page { padding: 12px 16px 16px; }

/* ===== pattern panel ===== */
.pattern-settings {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-top: 5px; padding: 7px 9px;
    border: 1px solid #222b38; border-radius: 8px; background: #10151d;
}
.pattern-settings[hidden] { display: none; }
.pattern-group {
    display: flex; align-items: center; gap: 5px;
    padding-right: 8px; border-right: 1px solid #222b38;
}
.pattern-group:last-child { border-right: 0; padding-right: 0; }
.pattern-group-label {
    color: #647386; font-size: 8px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
}
.pattern-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 7px; border: 1px solid #2a3544; border-radius: 20px;
    background: #0a0f16; color: #a7b3c2;
    font-size: 9px; font-weight: 600; cursor: pointer; user-select: none;
    transition: all .15s ease;
}
.pattern-chip input { display: none; }
.pattern-chip .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #3a4757;
    transition: all .15s ease;
}
.pattern-chip[data-on="true"] { border-color: currentColor; background: #18212c; }
.pattern-chip[data-on="true"] .dot { box-shadow: 0 0 6px currentColor; }
.pattern-chip[data-type="bullish"] { color: #26c98b; }
.pattern-chip[data-type="bearish"] { color: #f05d68; }
.pattern-chip[data-type="neutral"] { color: #c5a059; }
.pattern-chip[data-on="true"][data-type="bullish"] .dot { background: #26c98b; }
.pattern-chip[data-on="true"][data-type="bearish"] .dot { background: #f05d68; }
.pattern-chip[data-on="true"][data-type="neutral"] .dot { background: #c5a059; }
.pattern-chip[data-on="false"] { opacity: .45; }

.pattern-legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 5px; padding: 5px 9px;
    border: 1px solid #1a222c; border-radius: 7px; background: #0b1017;
    font-size: 9px; color: #8b98a8;
}
.pattern-legend[hidden] { display: none; }
.pattern-legend .lg { display: inline-flex; align-items: center; gap: 4px; }
.pattern-legend .sw {
    width: 8px; height: 8px; border-radius: 2px; display: inline-block;
}
.pattern-legend .lg b { color: #c4d0de; font-weight: 600; }
.pattern-legend .lg-sep { color: #2a3544; }
.pattern-legend .lg-stat { margin-left: auto; color: #647386; }
.pattern-legend .lg-stat b { color: #c5a059; }

.pattern-recent {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 5px; padding: 5px 9px;
    border: 1px solid #1a222c; border-radius: 7px; background: #0b1017;
    font-size: 9px; color: #8b98a8; align-items: center;
}
.pattern-recent[hidden] { display: none; }
.pattern-recent .pr-label {
    color: #647386; font-size: 8px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; margin-right: 3px;
}
.pattern-recent .pr-item {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px; border-radius: 4px;
    border: 1px solid #222b38; background: #0f151d;
    white-space: nowrap;
}
.pattern-recent .pr-item .pr-dot {
    width: 5px; height: 5px; border-radius: 50%;
}
.pattern-recent .pr-item .pr-name { color: #c4d0de; font-weight: 600; }
.pattern-recent .pr-item .pr-time { color: #5d6b7d; font-family: ui-monospace, Consolas, monospace; }

@media (max-width: 640px) {
    .pattern-settings { gap: 5px; padding: 5px 6px; }
    .pattern-group { padding-right: 5px; }
    .pattern-chip { padding: 2px 5px; font-size: 8px; }
    .pattern-legend, .pattern-recent { font-size: 8px; padding: 4px 6px; }
}
</style>

<body class="bg-brand-dark text-white font-inter flex flex-col min-h-screen">
    <main class="chart-page">
      <h1 class="sr-only">Зах зээлийн график</h1>
      <div class="chart-app">
        <section id="chart-settings" class="toolbar" aria-label="Графикийн тохиргоо">
            <select id="market" aria-label="Зах зээл" title="Зах зээл">
                <option value="spot">Spot</option>
                <option value="futures">Futures</option>
            </select>
            <input id="symbol" type="text" value="BTCUSDT" list="symbol-suggestions" maxlength="20"
                autocomplete="off" spellcheck="false" aria-label="Хослол" title="Хослол">
            <datalist id="symbol-suggestions"></datalist>
            <select id="interval" aria-label="Хугацаа" title="Хугацаа">
                <option value="1m">1m</option>
                <option value="3m">3m</option>
                <option value="5m">5m</option>
                <option value="15m">15m</option>
                <option value="30m">30m</option>
                <option value="1h">1h</option>
                <option value="2h">2h</option>
                <option value="4h">4h</option>
                <option value="6h">6h</option>
                <option value="12h">12h</option>
                <option value="1d">1d</option>
                <option value="1w">1w</option>
                <option value="1M">1M</option>
            </select>
            <button id="reload" type="button" aria-label="Шинэчлэх" title="Шинэчлэх">↻</button>
        </section>

        <section id="indicator-settings" class="indicator-settings" aria-label="Индикаторын тохиргоо" hidden>
            <label class="indicator-toggle" title="Идэвхжүүлээд график дээр эхлэлээс төгсгөл хүртэл чирнэ">
                <input id="showVolumeProfile" type="checkbox" aria-label="Volume Profile"> VP
            </label>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <label class="indicator-toggle" title="MACD үзүүлэлт">
                <input id="showMACD" type="checkbox" checked> MACD
            </label>
            <label class="indicator-period" title="MACD Fast">
                F <input id="macdFast" type="number" min="1" max="500" value="12" aria-label="MACD Fast">
            </label>
            <label class="indicator-period" title="MACD Slow">
                S <input id="macdSlow" type="number" min="2" max="500" value="26" aria-label="MACD Slow">
            </label>
            <label class="indicator-period" title="MACD Signal">
                Sig <input id="macdSignal" type="number" min="1" max="500" value="9" aria-label="MACD Signal">
            </label>
            <label class="indicator-toggle" title="RSI үзүүлэлт">
                <input id="showRSI" type="checkbox" checked> RSI
            </label>
            <label class="indicator-period" title="RSI Period">
                P <input id="rsiPeriod" type="number" min="1" max="500" value="14" aria-label="RSI Period">
            </label>
            <label class="indicator-toggle" title="EMA 1 үзүүлэлт">
                <input id="showEMA1" type="checkbox" checked>
                <span style="color:#f0b90b">EMA 1</span>
            </label>
            <label class="indicator-period" title="EMA 1 Period">
                P <input id="emaPeriod1" type="number" min="1" max="500" value="20" aria-label="EMA 1 Period">
            </label>
            <label class="indicator-toggle" title="EMA 2 үзүүлэлт">
                <input id="showEMA2" type="checkbox" checked>
                <span style="color:#38bdf8">EMA 2</span>
            </label>
            <label class="indicator-period" title="EMA 2 Period">
                P <input id="emaPeriod2" type="number" min="1" max="500" value="50" aria-label="EMA 2 Period">
            </label>
            <label class="indicator-toggle" title="Moving Average 1 үзүүлэлт">
                <input id="showMA1" type="checkbox" checked>
                <span style="color:#f472b6">MA 1</span>
            </label>
            <label class="indicator-period" title="Moving Average 1 Period">
                P <input id="maPeriod1" type="number" min="1" max="500" value="20" aria-label="Moving Average 1 Period">
            </label>
            <label class="indicator-toggle" title="Moving Average 2 үзүүлэлт">
                <input id="showMA2" type="checkbox" checked>
                <span style="color:#a3e635">MA 2</span>
            </label>
            <label class="indicator-period" title="Moving Average 2 Period">
                P <input id="maPeriod2" type="number" min="1" max="500" value="50" aria-label="Moving Average 2 Period">
            </label>
            <div class="indicator-apply-wrap">
                <button id="applyIndicators" type="button" aria-label="Үзүүлэлт хэрэглэх" title="Үзүүлэлт хэрэглэх">✓</button>
            </div>
        </section>

        <section id="trade-settings" class="trade-settings" aria-label="Арилжааны тохиргоо">
            <div class="trade-actions" role="group" aria-label="Арилжааны чиглэл">
                <button class="trade-action" type="button" data-action="buy" aria-pressed="false">BUY</button>
                <button class="trade-action" type="button" data-action="sell" aria-pressed="false">SELL</button>
                <button class="trade-action" type="button" data-action="long" aria-pressed="false">LONG</button>
                <button class="trade-action" type="button" data-action="short" aria-pressed="false">SHORT</button>
            </div>
            <label class="trade-field" for="trade-side">Side
                <select id="trade-side">
                    <option value="long">Long</option>
                    <option value="short">Short</option>
                    <option value="both">Long + Short</option>
                </select>
            </label>
            <label class="trade-field" for="account-balance">Balance
                <input id="account-balance" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00" aria-label="Account balance in USDT">
                <span>USDT</span>
            </label>
            <label class="trade-field" for="trade-margin">Margin
                <input id="trade-margin" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00" aria-label="Trade margin in USDT">
                <span>USDT</span>
            </label>
            <label class="trade-field" for="trade-leverage">Leverage
                <input id="trade-leverage" class="trade-leverage-input" type="number" min="1" max="125" step="1" placeholder="1" aria-label="Leverage">
                <span>x</span>
            </label>
        </section>


        <section id="pattern-settings" class="pattern-settings" aria-label="Candle pattern тохиргоо" hidden>

<script>
/* ===== ticker.js ===== */
(function () {
    "use strict";

    const input = document.getElementById("symbol");
    const suggestions = document.getElementById("symbol-suggestions");
    const status = document.getElementById("symbols-status");
    if (!input) return;

    const cache = new Map();
    let requestId = 0;
    let controller = null;

    function normalize() {
        return input.value.trim().toUpperCase();
    }

    function render(symbols) {
        const options = document.createDocumentFragment();
        symbols.forEach(symbol => {
            const option = document.createElement("option");
            option.value = symbol;
            options.append(option);
        });
        suggestions.replaceChildren(options);
        if (status) status.textContent = `${symbols.length.toLocaleString()} хослол`;
    }

    async function load(market) {
        const selectedMarket = market || window.ChartControls?.market?.value || "spot";
        const currentRequest = ++requestId;
        controller?.abort();
        controller = null;

        const cached = cache.get(selectedMarket);
        if (cached) {
            render(cached);
            return;
        }

        controller = new AbortController();
        if (status) status.textContent = "Хослолын жагсаалт...";

        const isFutures = selectedMarket === "futures";
        const hosts = isFutures
            ? ["https://data-api.binance.vision", "https://fapi.binance.com"]
            : ["https://data-api.binance.vision", "https://api.binance.com"];
        const path = isFutures ? "/fapi/v1/exchangeInfo" : "/api/v3/exchangeInfo";

        try {
            let response = null, data = null;
            for (const host of hosts) {
                try {
                    const res = await fetch(host + path, { cache: "force-cache", signal: controller.signal });
                    const body = await res.json();
                    if (res.ok && Array.isArray(body?.symbols)) { response = res; data = body; break; }
                } catch (e) {
                    if (e.name === "AbortError") throw e;
                }
            }
            if (!response) throw new Error("Биржийн хослолын жагсаалт авах боломжгүй");
            if (!Array.isArray(data.symbols)) throw new Error("Биржийн хослолын жагсаалт буруу байна.");

            const symbols = data.symbols
                .filter(item => item.status === "TRADING" && item.quoteAsset === "USDT" &&
                    (selectedMarket !== "futures" || item.contractType === "PERPETUAL"))
                .map(item => item.symbol)
                .sort();
            if (!symbols.length) throw new Error("Арилжааны хослолын жагсаалт хоосон байна.");
            if (currentRequest !== requestId) return;

            cache.set(selectedMarket, symbols);
            render(symbols);
        } catch (error) {
            if (error.name === "AbortError" || currentRequest !== requestId) return;
            if (status) status.textContent = "Хослолын санал авах боломжгүй";
            console.error("[CHART SYMBOLS ERROR]", error);
        } finally {
            if (currentRequest === requestId) controller = null;
        }
    }

    window.ChartControls = window.ChartControls || {};
    window.ChartControls.ticker = {
        input,
        suggestions,
        status,
        get value() {
            return normalize();
        },
        set value(value) {
            input.value = String(value).trim().toUpperCase();
        },
        load
    };

    input.addEventListener("change", () => {
        input.value = normalize();
        window.dispatchEvent(new CustomEvent("chart:ticker-change", {
            detail: { ticker: input.value }
        }));
    });
    input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            input.value = normalize();
            window.dispatchEvent(new CustomEvent("chart:ticker-change", {
                detail: { ticker: input.value }
            }));
        }
    });

    window.addEventListener("chart:market-change", event => {
        load(event.detail.market);
    });
})();

</script>

<script>
/* ===== vp.js ===== */
(function () {
    "use strict";

    let enabled = false;
    let selection = null;
    let dragSelection = null;
    let candles = [];
    let statusElement = null;
    let interval = "1m";
    let formatTime = String;
    let dragAnchor = null;

    function calculate(selected, sourceCandles = candles) {
        if (!selected || !sourceCandles.length) return null;
        const selectedCandles = sourceCandles.filter(candle =>
            candle[0] >= selected.startTime && candle[0] <= selected.endTime
        );
        if (!selectedCandles.length) return null;

        const binCount = 32;
        let minPrice = Math.min(...selectedCandles.map(candle => candle[3]));
        let maxPrice = Math.max(...selectedCandles.map(candle => candle[2]));
        if (minPrice === maxPrice) {
            const padding = Math.max(Math.abs(minPrice) * 0.000001, 0.00000001);
            minPrice -= padding;
            maxPrice += padding;
        }

        const binSize = (maxPrice - minPrice) / binCount;
        const bins = new Array(binCount).fill(0);
        selectedCandles.forEach(candle => {
            const volume = Math.max(0, candle[5]);
            if (!Number.isFinite(volume) || volume === 0) return;
            const low = candle[3];
            const high = candle[2];
            if (high <= low) {
                const index = Math.min(binCount - 1, Math.max(0, Math.floor((low - minPrice) / binSize)));
                bins[index] += volume;
                return;
            }
            const firstBin = Math.max(0, Math.floor((low - minPrice) / binSize));
            const lastBin = Math.min(binCount - 1, Math.floor((high - minPrice) / binSize));
            for (let index = firstBin; index <= lastBin; index++) {
                const binLow = minPrice + index * binSize;
                const binHigh = binLow + binSize;
                const overlap = Math.max(0, Math.min(high, binHigh) - Math.max(low, binLow));
                bins[index] += volume * overlap / (high - low);
            }
        });
        const maxVolume = Math.max(...bins);
        return { bins, candleCount: selectedCandles.length, minPrice, maxPrice, pocIndex: bins.indexOf(maxVolume) };
    }

    function updateStatus() {
        if (!statusElement) return;
        if (!enabled) {
            statusElement.textContent = "";
            return;
        }
        if (!selection) {
            statusElement.textContent = "VP · Эхлэлээс төгсгөл хүртэл чирнэ үү";
            return;
        }
        const profile = calculate(selection);
        statusElement.textContent = profile
            ? `VP · ${profile.candleCount} лаа · ${formatTime(selection.startTime)} → ${formatTime(selection.endTime)} · ойролцоо`
            : "VP · Сонгосон хүрээнд лаа алга";
    }

    function drawSelection(ctx, selected, plotLeft, plotTop, plotWidth, mainHeight, barWidth) {
        if (!selected) return;
        const selectedIndices = [];
        candles.forEach((candle, index) => {
            if (candle[0] >= selected.startTime && candle[0] <= selected.endTime) selectedIndices.push(index);
        });
        if (!selectedIndices.length) return;
        const visibleLeft = Math.max(plotLeft, plotLeft + selectedIndices[0] * barWidth);
        const visibleRight = Math.min(plotLeft + plotWidth, plotLeft + (selectedIndices[selectedIndices.length - 1] + 1) * barWidth);
        if (visibleRight <= visibleLeft) return;
        ctx.save();
        ctx.fillStyle = "rgba(197, 160, 89, .08)";
        ctx.fillRect(visibleLeft, plotTop, visibleRight - visibleLeft, mainHeight);
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "rgba(197, 160, 89, .65)";
        [visibleLeft, visibleRight].forEach(x => {
            ctx.beginPath();
            ctx.moveTo(x, plotTop);
            ctx.lineTo(x, plotTop + mainHeight);
            ctx.stroke();
        });
        ctx.setLineDash([]);
        ctx.restore();
    }

    function drawProfile(ctx, profile, priceToY, plotLeft, plotTop, plotWidth, mainHeight) {
        const maxVolume = Math.max(...profile.bins);
        if (!maxVolume) return;
        const binSize = (profile.maxPrice - profile.minPrice) / profile.bins.length;
        const maxBarWidth = Math.min(150, plotWidth * 0.32);
        const right = plotLeft + plotWidth;
        ctx.save();
        ctx.beginPath();
        ctx.rect(plotLeft, plotTop, plotWidth, mainHeight);
        ctx.clip();
        profile.bins.forEach((volume, index) => {
            if (!volume) return;
            const binLow = profile.minPrice + index * binSize;
            const binHigh = binLow + binSize;
            const top = Math.max(plotTop, priceToY(binHigh));
            const bottom = Math.min(plotTop + mainHeight, priceToY(binLow));
            if (bottom <= top) return;
            const width = maxBarWidth * volume / maxVolume;
            ctx.fillStyle = index === profile.pocIndex
                ? "rgba(197, 160, 89, .78)"
                : "rgba(90, 160, 195, .38)";
            ctx.fillRect(right - width, top, width, Math.max(1, bottom - top - 0.5));
        });
        const pocPrice = profile.minPrice + (profile.pocIndex + 0.5) * binSize;
        const pocY = priceToY(pocPrice);
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "rgba(255, 213, 128, .9)";
        ctx.beginPath();
        ctx.moveTo(Math.max(plotLeft, right - maxBarWidth), pocY);
        ctx.lineTo(right, pocY);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }

    function configure(options) {
        statusElement = options.statusElement;
        formatTime = options.formatTime;
        interval = options.getInterval();
        const input = document.getElementById("showVolumeProfile");
        if (input) {
            input.addEventListener("change", () => {
                enabled = input.checked;
                if (!enabled) selection = null;
                dragSelection = null;
                dragAnchor = null;
                updateStatus();
                options.onChange();
            });
        }
    }

    window.ChartIndicators = window.ChartIndicators || {};
    window.ChartIndicators.vp = {
        configure,
        updateCandles(value) { candles = value || []; },
        updateInterval(value) { interval = value; },
        isEnabled() { return enabled; },
        getSelection() { return selection; },
        getDragSelection() { return dragSelection; },
        calculate,
        updateStatus,
        drawSelection,
        drawProfile,
        begin(layout, candleTime) {
            dragAnchor = candleTime;
            dragSelection = { startTime: candleTime, endTime: candleTime };
            selection = dragSelection;
            updateStatus();
        },
        move(layout, candleTime) {
            if (!dragSelection || dragAnchor === null) return;
            dragSelection = {
                startTime: Math.min(dragAnchor, candleTime),
                endTime: Math.max(dragAnchor, candleTime)
            };
            selection = dragSelection;
            updateStatus();
        },
        end() { dragSelection = null; dragAnchor = null; },
        clear() { selection = null; dragSelection = null; dragAnchor = null; updateStatus(); }
    };
})();

</script>
<script>
/* ===== macd.js ===== */
(function () {
    "use strict";
    function ema(values, period) {
        if (!values.length) return [];
        const multiplier = 2 / (period + 1);
        const result = [values[0]];
        for (let i = 1; i < values.length; i++) result.push(values[i] * multiplier + result[i - 1] * (1 - multiplier));
        return result;
    }
    function calculate(closes, periods) {
        const fast = ema(closes, periods.fast);
        const slow = ema(closes, periods.slow);
        const macd = fast.map((value, i) => value - slow[i]);
        const signal = ema(macd, periods.signal);
        return { macd, signal, histogram: macd.map((value, i) => value - signal[i]) };
    }
    function draw(ctx, data, periods, { start, candles, plotLeft, plotWidth, top, height, barWidth, hoverIndex }) {
        const macd = data.macd.slice(start, start + candles.length);
        const signal = data.signal.slice(start, start + candles.length);
        const histogram = data.histogram.slice(start, start + candles.length);
        const values = [...macd, ...signal, ...histogram, 0];
        let min = Math.min(...values);
        let max = Math.max(...values);
        if (max === min) { min += 1; max -= 1; }
        const innerTop = top + 16;
        const innerHeight = Math.max(1, height - 20);
        const valueToY = value => innerTop + (max - value) / (max - min) * innerHeight;
        const zeroY = valueToY(0);
        ctx.strokeStyle = "#26303d";
        ctx.beginPath(); ctx.moveTo(plotLeft, top); ctx.lineTo(plotLeft + plotWidth, top); ctx.stroke();
        ctx.fillStyle = "#7e8da0"; ctx.font = "10px Inter, Arial, sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText(`MACD (${periods.fast}, ${periods.slow}, ${periods.signal})`, plotLeft + 5, top + 3);
        ctx.beginPath(); ctx.moveTo(plotLeft, zeroY); ctx.lineTo(plotLeft + plotWidth, zeroY); ctx.stroke();
        histogram.forEach((value, i) => {
            const x = plotLeft + (i + 0.5) * barWidth;
            ctx.fillStyle = value >= 0 ? "rgba(38, 201, 139, .72)" : "rgba(240, 93, 104, .72)";
            ctx.fillRect(x - Math.max(1, barWidth * 0.32), Math.min(zeroY, valueToY(value)),
                Math.max(1, barWidth * 0.64), Math.max(1, Math.abs(valueToY(value) - zeroY)));
        });
        [[macd, "#40b8f5"], [signal, "#f5a64a"]].forEach(([series, color]) => {
            ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.beginPath();
            series.forEach((value, i) => {
                const x = plotLeft + (i + 0.5) * barWidth;
                const y = valueToY(value);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();
        });
        if (hoverIndex !== null) {
            const i = hoverIndex - start;
            if (i >= 0 && i < macd.length) {
                ctx.fillStyle = "#40b8f5";
                ctx.fillText(`MACD ${macd[i].toFixed(6)}   Signal ${signal[i].toFixed(6)}`, plotLeft + 130, top + 3);
            }
        }
    }
    window.ChartIndicators = window.ChartIndicators || {};
    window.ChartIndicators.macd = { calculate, draw };
})();

</script>
<script>
/* ===== rsi.js ===== */
(function () {
    "use strict";

    function calculate(closes, period) {
        if (!closes.length) return [];
        const win = Math.max(1, Number(period) || 14);
        if (closes.length <= win) return new Array(closes.length).fill(NaN);

        const result = new Array(closes.length).fill(NaN);
        let avgGain = 0;
        let avgLoss = 0;

        for (let i = 1; i <= win; i++) {
            const change = closes[i] - closes[i - 1];
            avgGain += change > 0 ? change : 0;
            avgLoss += change < 0 ? -change : 0;
        }
        avgGain /= win;
        avgLoss /= win;

        result[win] = avgLoss === 0
            ? 100
            : 100 - (100 / (1 + avgGain / avgLoss));

        for (let i = win + 1; i < closes.length; i++) {
            const change = closes[i] - closes[i - 1];
            avgGain = (avgGain * (win - 1) + (change > 0 ? change : 0)) / win;
            avgLoss = (avgLoss * (win - 1) + (change < 0 ? -change : 0)) / win;
            result[i] = avgLoss === 0
                ? 100
                : 100 - (100 / (1 + avgGain / avgLoss));
        }
        return result;
    }

    function draw(ctx, values, period, { start, candles, plotLeft, plotWidth, top, height, barWidth, hoverIndex }) {
        const innerTop = top + 16;
        const innerHeight = Math.max(1, height - 20);
        const valueToY = value => innerTop + (100 - value) / 100 * innerHeight;

        ctx.strokeStyle = "#26303d";
        ctx.beginPath();
        ctx.moveTo(plotLeft, top);
        ctx.lineTo(plotLeft + plotWidth, top);
        ctx.stroke();

        ctx.fillStyle = "#7e8da0";
        ctx.font = "10px Inter, Arial, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(`RSI (${period})`, plotLeft + 5, top + 3);

        ctx.setLineDash([3, 3]);
        [70, 50, 30].forEach(value => {
            const y = valueToY(value);
            ctx.strokeStyle = value === 50 ? "#26303d" : "rgba(214, 225, 238, .28)";
            ctx.beginPath();
            ctx.moveTo(plotLeft, y);
            ctx.lineTo(plotLeft + plotWidth, y);
            ctx.stroke();
        });
        ctx.setLineDash([]);

        ctx.fillStyle = "#8795a7";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        [100, 70, 50, 30, 0].forEach(value => {
            ctx.fillText(String(value), plotLeft + plotWidth - 4, valueToY(value));
        });

        const visibleValues = values.slice(start, start + candles.length);
        ctx.strokeStyle = "#b679e5";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        let drawing = false;
        visibleValues.forEach((value, i) => {
            if (!Number.isFinite(value)) {
                drawing = false;
                return;
            }
            const x = plotLeft + (i + 0.5) * barWidth;
            const y = valueToY(Math.max(0, Math.min(100, value)));
            if (drawing) ctx.lineTo(x, y);
            else ctx.moveTo(x, y);
            drawing = true;
        });
        ctx.stroke();

        if (hoverIndex !== null) {
            const i = hoverIndex - start;
            if (i >= 0 && i < visibleValues.length && Number.isFinite(visibleValues[i])) {
                ctx.fillStyle = "#b679e5";
                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.fillText(`RSI ${visibleValues[i].toFixed(2)}`, plotLeft + 130, top + 3);
            }
        }
    }

    window.ChartIndicators = window.ChartIndicators || {};
    window.ChartIndicators.rsi = { calculate, draw };
})();

</script>

        for (let i = 1; i < closes.length; i++) result.push(closes[i] * multiplier + result[i - 1] * (1 - multiplier));
        return result;
    }
    function draw(ctx, values, color, { start, candles, plotLeft, plotWidth, barWidth, priceToY }) {
        ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.beginPath();
        let drawing = false;
        values.slice(start, start + candles.length).forEach((value, i) => {
            if (!Number.isFinite(value)) { drawing = false; return; }
            const x = plotLeft + (i + 0.5) * barWidth;
            const y = priceToY(value);
            if (drawing) ctx.lineTo(x, y); else ctx.moveTo(x, y);
            drawing = true;
        });
        ctx.stroke();
    }
    window.ChartIndicators = window.ChartIndicators || {};
    window.ChartIndicators.ema = { calculate, draw };
})();

(function () {

    function calculate(closes, period) {
        const result = new Array(closes.length).fill(null);
        let sum = 0;
        for (let i = 0; i < closes.length; i++) {
            sum += closes[i];
            if (i >= period) sum -= closes[i - period];
            if (i >= period - 1) result[i] = sum / period;
        }

            if (body(a) < rng(a) * 0.5 || body(b) < rng(b) * 0.5 || body(x) < rng(x) * 0.5) return null;
            if (!(b[4] > a[4] && x[4] > b[4])) return null;
            if (!(b[1] > a[1] && x[1] > b[1])) return null;
            if (upSh(a) > body(a) * 0.4 || upSh(b) > body(b) * 0.4 || upSh(x) > body(x) * 0.4) return null;
            return { strength: 3 };
        }
    });

    reg({
        name: "Three Black Crows", type: "bearish", count: 3, strength: 3,
        desc: "Гурван дараалсан хүчтэй улаан лаа — уналт батлагдлаа",
        detect(c, i) {

            if (body(a) < rng(a) * 0.5 || body(b) < rng(b) * 0.5 || body(x) < rng(x) * 0.5) return null;
            if (!(b[4] < a[4] && x[4] < b[4])) return null;
            if (!(b[1] < a[1] && x[1] < b[1])) return null;
            if (dnSh(a) > body(a) * 0.4 || dnSh(b) > body(b) * 0.4 || dnSh(x) > body(x) * 0.4) return null;
            return { strength: 3 };
        }
    });

    reg({
        name: "Three Inside Up", type: "bullish", count: 3, strength: 3,
        desc: "Harami + баталгаажуулах ногоон лаа — эргэлт батлагдлаа",
        detect(c, i) {
            if (i < 2) return null;
            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isBear(a) || !isBull(b) || !isBull(x)) return null;
            if (body(a) < rng(a) * 0.5) return null;
            if (topBody(b) >= topBody(a) || botBody(b) <= botBody(a)) return null;
            if (x[4] <= topBody(a)) return null;
            return { strength: 3 };
        }
    });

    reg({
        name: "Three Inside Down", type: "bearish", count: 3, strength: 3,
        desc: "Harami + баталгаажуулах улаан лаа — эргэлт батлагдлаа",
        detect(c, i) {
            if (i < 2) return null;
            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isBull(a) || !isBear(b) || !isBear(x)) return null;
            if (body(a) < rng(a) * 0.5) return null;
            if (topBody(b) >= topBody(a) || botBody(b) <= botBody(a)) return null;
            if (x[4] >= botBody(a)) return null;
            return { strength: 3 };
        }
    });

    reg({
        name: "Three Outside Up", type: "bullish", count: 3, strength: 3,
        desc: "Engulfing + баталгаажуулах ногоон лаа — хүчтэй эргэлт",
        detect(c, i) {
            if (i < 2) return null;
            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isBear(a) || !isBull(b) || !isBull(x)) return null;
            if (topBody(b) <= topBody(a) || botBody(b) >= botBody(a)) return null;
            if (x[4] <= b[4]) return null;
            return { strength: 3 };
        }
    });

    reg({
        name: "Three Outside Down", type: "bearish", count: 3, strength: 3,
        desc: "Engulfing + баталгаажуулах улаан лаа — хүчтэй эргэлт",
        detect(c, i) {

            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isBull(a) || !isBear(b) || !isBear(x)) return null;
            if (topBody(b) <= topBody(a) || botBody(b) >= botBody(a)) return null;

    });

    reg({
        name: "Bullish Abandoned Baby", type: "bullish", count: 3, strength: 3,
        desc: "Doji цоорхойтой тусгаарлагдсан — маш хүчтэй ёроол",
        detect(c, i) {

            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isBear(a) || !isBull(x)) return null;
            if (!isDoji(b)) return null;
            if (b[2] >= a[3]) return null;
            if (b[3] <= x[2]) return null;
            if (x[4] <= midBody(a)) return null;
            return { strength: 3 };
        }
    });

    reg({
        name: "Bearish Abandoned Baby", type: "bearish", count: 3, strength: 3,
        desc: "Doji цоорхойтой тусгаарлагдсан — маш хүчтэй оргил",
        detect(c, i) {
            if (i < 2) return null;
            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isBull(a) || !isBear(x)) return null;
            if (!isDoji(b)) return null;
            if (b[3] <= a[2]) return null;
            if (b[2] >= x[3]) return null;
            if (x[4] >= midBody(a)) return null;
            return { strength: 3 };
        }
    });

    reg({
        name: "Tri-Star Bottom", type: "bullish", count: 3, strength: 2,
        desc: "Гурван дараалсан Doji ёроолд — эргэлтийн бүс",
        detect(c, i) {
            if (i < 2) return null;
            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isDoji(a) || !isDoji(b) || !isDoji(x)) return null;
            if (!(b[4] < a[4] && x[4] > b[4])) return null;
            return { strength: 2 };
        }
    });

    reg({
        name: "Tri-Star Top", type: "bearish", count: 3, strength: 2,
        desc: "Гурван дараалсан Doji оргилд — эргэлтийн бүс",
        detect(c, i) {
            if (i < 2) return null;
            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isDoji(a) || !isDoji(b) || !isDoji(x)) return null;
            if (!(b[4] > a[4] && x[4] < b[4])) return null;
            return { strength: 2 };
        }
    });

    reg({
        name: "Stick Sandwich", type: "bullish", count: 3, strength: 2,
        desc: "Хоёр ижил хаалттай ногоон лааны дунд улаан — дэмжлэг",
        detect(c, i) {
            if (i < 2) return null;
            const a = c[i - 2], b = c[i - 1], x = c[i];
            if (!isBull(a) || !isBear(b) || !isBull(x)) return null;
            const tol = rng(a) * 0.1;
            if (Math.abs(a[4] - x[4]) > tol) return null;
            if (b[4] >= a[4]) return null;
            return { strength: 2 };
        }
    });

    /* ------------------------------------------------------------- compute */
    const cache = {
        candles: [],
        ctx: null,
        byIndex: new Map(),
        list: [],
        stats: { total: 0, bullish: 0, bearish: 0, neutral: 0, byName: {} }
    };
    let lastDraw = { placed: 0, skipped: 0, boxes: [], labels: [] };

    function compute(candles) {
        cache.candles = candles || [];
        cache.byIndex = new Map();
        cache.list = [];
        cache.stats = { total: 0, bullish: 0, bearish: 0, neutral: 0, byName: {} };
        if (!cache.candles.length) { cache.ctx = null; return; }

        const ctx = buildContext(cache.candles);
        cache.ctx = ctx;

        for (let i = 0; i < cache.candles.length; i++) {
            const hits = [];
            for (let p = 0; p < REGISTRY.length; p++) {
                const def = REGISTRY[p];
                if (i < def.count - 1) continue;
                let res = null;
                try { res = def.detect(cache.candles, i, ctx); } catch (e) { res = null; }
                if (!res) continue;
                hits.push({
                    name: def.name,
                    type: def.type,
                    count: def.count,
                    strength: res.strength || def.strength || 1,
                    desc: def.desc,
                    index: i,
                    time: cache.candles[i][0]
                });
            }
            if (!hits.length) continue;
            hits.sort((a, b) => b.strength - a.strength || b.count - a.count);
            cache.byIndex.set(i, hits);
            hits.forEach(h => {
                cache.list.push(h);
                cache.stats.total++;
                cache.stats[h.type]++;
                cache.stats.byName[h.name] = (cache.stats.byName[h.name] || 0) + 1;
            });
        }

        /* ---- quality filter: keep only meaningful, well-separated signals ----
           Raw detection is intentionally permissive (every classical definition).
           A pattern is promoted to a *signal* only when it also passes:
             1. size  — the pattern's own range is a real move, not noise
             2. space — no stronger signal within COOLDOWN bars
           This is what turns 700+ raw hits into a readable set of markers. */
        const COOLDOWN = 6;
        const atr = ctx.atr;
        const ranked = cache.list.slice().sort((a, b) =>
            b.strength - a.strength || b.count - a.count || a.index - b.index);
        const accepted = [];
        const taken = new Set();
        ranked.forEach(hit => {
            const c = cache.candles[hit.index];
            const a = atr[hit.index];
            if (!Number.isFinite(a) || a <= 0) return;
            /* 1. size: pattern range must be at least 0.55 ATR */
            const span = c[2] - c[3];
            if (span < a * 0.55) return;
            /* 2. space: no accepted signal of the same direction nearby */
            for (let d = -COOLDOWN; d <= COOLDOWN; d++) {
                if (d === 0) continue;
                if (taken.has(hit.index + d)) return;
            }
            taken.add(hit.index);
            accepted.push(hit);
        });

        cache.byIndex = new Map();
        cache.list = accepted;
        cache.stats = { total: 0, bullish: 0, bearish: 0, neutral: 0, byName: {} };
        accepted.forEach(h => {
            if (!cache.byIndex.has(h.index)) cache.byIndex.set(h.index, []);
            cache.byIndex.get(h.index).push(h);
            cache.stats.total++;
            cache.stats[h.type]++;
            cache.stats.byName[h.name] = (cache.stats.byName[h.name] || 0) + 1;
        });
        cache.byIndex.forEach(list => list.sort((a, b) => b.strength - a.strength || b.count - a.count));
    }

    function getAt(index) { return cache.byIndex.get(index) || null; }

    function getRecent(limit) {
        const out = cache.list.filter(passes).sort((a, b) => b.index - a.index);
        return limit ? out.slice(0, limit) : out;
    }

    /* stats reflect the CURRENT filter, so the panel number matches the chart */
    function stats() {
        const s = { total: 0, bullish: 0, bearish: 0, neutral: 0, byName: {} };
        cache.list.forEach(h => {
            if (!passes(h)) return;
            s.total++;
            s[h.type]++;
            s.byName[h.name] = (s.byName[h.name] || 0) + 1;
        });
        return s;
    }

    /* raw (unfiltered) totals, for reporting */
    function rawStats() { return cache.stats; }

    /* ------------------------------------------------------------ options */
    const options = {
        enabled: true,
        types: { bullish: true, bearish: true, neutral: true },
        minStrength: 1,
        counts: { 1: true, 2: true, 3: true },
        labels: true,
        all: false
    };

    function setOptions(patch) {
        if (!patch) return options;
        if (typeof patch.enabled === "boolean") options.enabled = patch.enabled;
        if (patch.types) Object.assign(options.types, patch.types);
        if (typeof patch.minStrength === "number") options.minStrength = patch.minStrength;
        if (patch.counts) Object.assign(options.counts, patch.counts);
        if (typeof patch.labels === "boolean") options.labels = patch.labels;
        if (typeof patch.all === "boolean") options.all = patch.all;
        return options;
    }

    function getOptions() { return options; }

    function passes(hit) {
        if (!options.types[hit.type]) return false;
        if (hit.strength < options.minStrength) return false;
        if (!options.counts[hit.count]) return false;
        return true;
    }

    /* ------------------------------------------------------------- drawing */
    function roundRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, h / 2, w / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();
    }

    function overlaps(a, b) {
        return !(a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1);
    }

    function draw(ctx, layout) {
        lastDraw = { placed: 0, skipped: 0, boxes: [], labels: [] };
        if (!options.enabled || !cache.candles.length) return;
        const { plotLeft, plotTop, mainHeight, barWidth, start, candles, priceToY } = layout;
        if (!candles || !candles.length) return;

        const occupied = [];
        const plotRight = plotLeft + layout.plotWidth;
        const plotBottom = plotTop + mainHeight;

        /* collect visible hits, one badge per candle unless options.all */
        const items = [];
        for (let v = 0; v < candles.length; v++) {
            const abs = start + v;
            const hits = cache.byIndex.get(abs);
            if (!hits) continue;
            const filtered = hits.filter(passes);
            if (!filtered.length) continue;
            const primary = filtered[0];
            items.push({
                abs, v, primary, extra: filtered.length - 1,
                all: filtered,
                x: plotLeft + (v + 0.5) * barWidth,
                candle: candles[v]
            });
        }
        if (!items.length) return;

        /* draw in order of strength so strong ones win the closest slot */
        items.sort((a, b) => b.primary.strength - a.primary.strength);

        const placed = [];
        const FONT = "600 8.5px Inter, Arial, sans-serif";
        ctx.font = FONT;

        /* ------------------------------------------------------------------
           Placement strategy (professional, never hides its own candle):
             1. try to the RIGHT of the candle, vertically at its extreme
             2. then to the LEFT
             3. then stacked further out on either side
           A leader line ties the badge back to the candle's high/low.
           ------------------------------------------------------------------ */
        const laneRows = [];
        items.forEach(item => {
            const { primary, candle, x } = item;
            const color = COLORS[primary.type];
            const isBearish = primary.type === "bearish";

            const highY = priceToY(candle[2]);
            const lowY = priceToY(candle[3]);

            /* ---- compact triangle marker, always just outside the candle ---- */
            const MS = 9;                       /* marker box */
            const gap = 3;
            let my = isBearish ? highY - gap - MS : lowY + gap;
            my = Math.max(plotTop + 1, Math.min(my, plotBottom - MS - 1));

            /* nudge sideways only when the slot is already taken */
            let mx = x - MS / 2;
            let mrect = { x0: mx - 1, x1: mx + MS + 1, y0: my - 1, y1: my + MS + 1 };
            if (placed.some(p => overlaps(p, mrect))) {
                let found = false;
                for (let step = 1; step <= 6 && !found; step++) {
                    for (const sgn of [1, -1]) {
                        const cx2 = x - MS / 2 + sgn * step * (MS + 2);
                        if (cx2 < plotLeft + 1 || cx2 + MS > plotRight - 1) continue;
                        const r2 = { x0: cx2 - 1, x1: cx2 + MS + 1, y0: my - 1, y1: my + MS + 1 };
                        if (placed.some(p => overlaps(p, r2))) continue;
                        mx = cx2; mrect = r2; found = true; break;
                    }
                }
                if (!found) { lastDraw.skipped++; return; }
            }
            placed.push(mrect);
            lastDraw.placed++;
            lastDraw.boxes.push({ x: mrect.x0, y: mrect.y0, w: MS + 2, h: MS + 2, name: primary.name });

            /* leader line from the candle's extreme to the marker */
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, isBearish ? highY : lowY);
            ctx.lineTo(mx + MS / 2, isBearish ? my + MS : my);
            ctx.stroke();
            ctx.globalAlpha = 1;

            /* triangle */
            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.shadowBlur = 3;
            ctx.fillStyle = color;
            ctx.beginPath();
            if (isBearish) {
                ctx.moveTo(mx + MS / 2, my + MS);
                ctx.lineTo(mx, my);
                ctx.lineTo(mx + MS, my);
            } else {
                ctx.moveTo(mx + MS / 2, my);
                ctx.lineTo(mx, my + MS);
                ctx.lineTo(mx + MS, my + MS);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = "rgba(6,9,13,0.9)";
            ctx.lineWidth = 1;
            ctx.stroke();

            /* ---- name label: only when the zoom gives real horizontal room ----
               At the default zoom one bar is ~1.4px, so a 90px label would span
               ~60 candles and inevitably sit on top of price action. Labels are
               therefore shown only once the user zooms in (barWidth >= 14px).
               Names stay available at every zoom in the hover tooltip and in
               the "Сүүлийн" strip under the chart. */
            const canLabel = options.labels && barWidth >= 14 && (primary.strength >= 2 || options.all);
            if (!canLabel) return;

            const text = item.extra > 0 ? `${primary.name} +${item.extra}` : primary.name;
            ctx.font = FONT;
            const tw = ctx.measureText(text).width;
            const w = tw + 16;
            const h = 13;

            /* label sits beside the marker, on the far side from the candle */
            const labelCands = [
                { x: mx + MS + 3, y: my + MS / 2 - h / 2 },
                { x: mx - w - 3, y: my + MS / 2 - h / 2 },
                { x: mx + MS + 3, y: my - h - 2 },
                { x: mx - w - 3, y: my - h - 2 },
                { x: mx + MS + 3, y: my + MS + 2 },
                { x: mx - w - 3, y: my + MS + 2 }
            ];

            /* every visible candle's body+wick, so a label never covers price */
            const candleRects = [];
            for (let v = 0; v < candles.length; v++) {
                const cc = candles[v];
                const cxp = plotLeft + (v + 0.5) * barWidth;
                candleRects.push({
                    x0: cxp - Math.max(1, barWidth / 2) - 1,
                    x1: cxp + Math.max(1, barWidth / 2) + 1,
                    y0: priceToY(cc[2]) - 1,
                    y1: priceToY(cc[3]) + 1
                });
            }

            let lb = null;
            for (const c2 of labelCands) {
                let bx = c2.x, by = c2.y;
                if (bx < plotLeft + 1 || bx + w > plotRight - 1) continue;
                if (by < plotTop + 1 || by + h > plotBottom - 1) continue;
                const r3 = { x0: bx - 1, x1: bx + w + 1, y0: by - 1, y1: by + h + 1 };
                if (placed.some(p => overlaps(p, r3))) continue;
                if (candleRects.some(cr => overlaps(cr, r3))) continue;
                lb = { x: bx, y: by, rect: r3 };
                break;
            }
            if (!lb) return;
            placed.push(lb.rect);
            lastDraw.labels.push({ x: lb.rect.x0, y: lb.rect.y0, w: w + 2, h: h + 2, name: primary.name });

            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = 3;
            ctx.fillStyle = "rgba(6,9,13,0.95)";
            roundRect(ctx, lb.x, lb.y, w, h, 3);
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.55;
            ctx.lineWidth = 1;
            roundRect(ctx, lb.x, lb.y, w, h, 3);
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.textBaseline = "middle";
            ctx.textAlign = "left";
            ctx.font = FONT;
            ctx.fillStyle = "#eef4fb";
            ctx.fillText(text, lb.x + 6, lb.y + h / 2 + 0.5);
        });

        /* hover tooltip listing every pattern on the hovered candle */
        const hoverIndex = layout.hoverIndex;
        if (hoverIndex !== null && hoverIndex !== undefined) {
            const hits = cache.byIndex.get(hoverIndex);
            if (hits && hits.length) {
                const filtered = hits.filter(passes);
                if (filtered.length) drawTooltip(ctx, layout, filtered, hoverIndex);
            }
        }
    }

    function drawTooltip(ctx, layout, hits, hoverIndex) {
        const { plotLeft, plotTop, plotWidth, mainHeight, barWidth, start, candles } = layout;
        const v = hoverIndex - start;
        if (v < 0 || v >= candles.length) return;
        const x = plotLeft + (v + 0.5) * barWidth;

        const padX = 8, padY = 7, lineH = 13;
        const title = `${hits.length} pattern${hits.length > 1 ? "s" : ""}`;
        ctx.font = "700 9px Inter, Arial, sans-serif";
        let maxW = ctx.measureText(title).width;
        ctx.font = "9px Inter, Arial, sans-serif";
        hits.forEach(h => {
            const t = `${h.name}  ·  ${h.type}  ·  ${h.strength}/3`;
            maxW = Math.max(maxW, ctx.measureText(t).width);
        });
        const w = Math.min(230, maxW + padX * 2 + 10);
        const h = padY * 2 + lineH * (hits.length + 1);

        let bx = x + 12;
        if (bx + w > plotLeft + plotWidth) bx = x - w - 12;
        bx = Math.max(plotLeft + 2, bx);
        let by = plotTop + 8;
        if (by + h > plotTop + mainHeight) by = plotTop + mainHeight - h - 2;

        ctx.fillStyle = "rgba(10, 14, 20, 0.97)";
        roundRect(ctx, bx, by, w, h, 5);
        ctx.fill();
        ctx.strokeStyle = "#2a3544";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.font = "700 9px Inter, Arial, sans-serif";
        ctx.fillStyle = "#8fa0b5";
        ctx.fillText(title, bx + padX, by + padY + lineH / 2);

        hits.forEach((hit, k) => {
            const y = by + padY + lineH * (k + 1) + lineH / 2;
            const color = COLORS[hit.type];
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(bx + padX + 3, y, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = "600 9px Inter, Arial, sans-serif";
            ctx.fillStyle = "#e6edf5";
            ctx.fillText(hit.name, bx + padX + 10, y);

            ctx.font = "9px Inter, Arial, sans-serif";
            ctx.fillStyle = color;
            const nameW = ctx.measureText(hit.name).width;
            ctx.fillText(`${hit.type} · ${hit.strength}/3`, bx + padX + 16 + nameW, y);
        });
    }

    /* --------------------------------------------------------------- export */
    window.ChartPatterns = {
        compute, draw, getAt, getRecent, setOptions, getOptions, stats, rawStats,
        lastDraw: () => lastDraw,
        COLORS, GLYPH,
        registry: REGISTRY.map(d => ({ name: d.name, type: d.type, count: d.count, strength: d.strength, desc: d.desc }))
    };
})();

</script>
