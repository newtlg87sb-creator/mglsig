<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>MyData - MGL Signal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/png" href="/static/new/images/logogo1.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 'dark': '#05070a', 'dark-blue': '#0f1217', 'gold': '#c5a059', 'border': '#1f242d' }
                    },
                    fontFamily: { 'inter': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="/static/main_style.css">
    <link rel="stylesheet" href="/static/data_style.css">
</head>
<body class="bg-brand-dark text-white font-inter">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/static/js/header.js"></script>

    <main class="mydata-page">
        <h1 class="text-2xl font-bold mb-3">MyData · Private indicator JSON</h1>
        <p class="text-sm text-gray-400 mb-6">Зөвхөн зөвшөөрөгдсөн Supabase account энэ үр дүнг авах боломжтой.</p>
        <form id="mydata-form" class="mydata-controls">
            <label>Symbol
                <input
                    id="mydata-symbol"
                    name="symbol"
                    value="BTCUSDT"
                    maxlength="20"
                    list="coinList"
                    autocomplete="off"
                    required
                >
                <datalist id="coinList"></datalist>
            </label>
            <label>Market
                <select id="mydata-market" name="market">
                    <option value="spot">Spot</option>
                    <option value="futures">Futures</option>
                </select>
            </label>
            <label>Interval
                <select id="mydata-interval" name="interval">
                    <option value="1m" selected>1m</option>
                    <option value="5m">5m</option>
                    <option value="15m">15m</option>
                    <option value="1h">1h</option>
                    <option value="4h">4h</option>
                    <option value="1d">1dd</option>
                </select>
            </label>
            <button type="submit">JSON авах</button>
        </form>
        <div id="mydata-message" role="status" aria-live="polite"></div>
        <pre id="mydata-output">{}</pre>
    </main>

    
    <section id="rate-monitor" class="rate-monitor">
        <div class="rate-monitor-heading">
            <h2>Binance API Monitor</h2>
            <span id="monitor-status" class="monitor-status">● Monitoring</span>
        </div>

        <div class="rate-progress">
            <div id="rate-progress-bar"></div>
        </div>

        <div class="rate-grid">
            <div class="rate-card">
                <span>MyData Calls / Min</span>
                <strong id="rate-requests">0</strong>
            </div>
            <div class="rate-card">
                <span>Request Weight</span>
                <strong id="rate-weight">0 / 0</strong>
                <small id="rate-weight-percent">0%</small>
            </div>
            <div class="rate-card">
                <span>HTTP 429</span>
                <strong id="rate-429">0</strong>
            </div>
            <div class="rate-card">
                <span>HTTP 418</span>
                <strong id="rate-418">0</strong>
            </div>
            <div class="rate-card">
                <span>Cache</span>
                <strong id="rate-cache">--</strong>
            </div>
            <div class="rate-card">
                <span>Last Request</span>
                <strong id="rate-last">--</strong>
            </div>
        </div>
        <div class="rate-note" id="rate-note">
            Binance API usage monitoring
        </div>
    </section>


    <script>
        
                
        const mydataForm = document.getElementById("mydata-form");
        const mydataOutput = document.getElementById("mydata-output");
        const mydataMessage = document.getElementById("mydata-message");

        const ADMIN_USER_ID = "21f19ae0-b35e-4984-b8dc-dc8e463b0155";
        const REFRESH_INTERVAL = 1000;

        let autoRefresh = true;
        let refreshTimer = null;
        let isLoading = false;

        const marketInfoCache = new Map();

        const rateMonitor = {
            requests: [],
            errors429: 0,
            errors418: 0,
            weight: null,
            weightLimit: null,
            cache: "--",
            lastRequest: "--"
        };

        async function loadMarketInfo(market) {
            const cached = marketInfoCache.get(market);

            if (cached && Date.now() - cached.time < 3600000) {
                applyMarketInfo(cached.data);
                return;
            }

            const endpoint = market === "futures"
                ? "https://fapi.binance.com/fapi/v1/exchangeInfo"
                : "https://api.binance.com/api/v3/exchangeInfo";

            try {
                document.getElementById("rate-note").textContent =
                    `${market.toUpperCase()} мэдээлэл татаж байна...`;

                const response = await fetch(endpoint);

                if (!response.ok) {
                    throw new Error("ExchangeInfo татахад алдаа гарлаа.");
                }

                const data = await response.json();

                marketInfoCache.set(market, {
                    time: Date.now(),
                    data
                });

                applyMarketInfo(data);

            } catch (error) {
                document.getElementById("rate-note").textContent =
                    error.message;
            }
        }

        function applyMarketInfo(data) {
            const symbolInput = document.getElementById("mydata-symbol");
            const datalist = document.getElementById("coinList");

            const market = document.getElementById("mydata-market").value;

            const limits = (data.rateLimits || []).find(item =>
                item.rateLimitType === "REQUEST_WEIGHT" &&
                item.interval === "MINUTE" &&
                item.intervalNum === 1
            );

            rateMonitor.weightLimit = limits?.limit ?? null;

            const symbols = (data.symbols || []).filter(item =>
                item.status === "TRADING" &&
                item.quoteAsset === "USDT" &&
                (market !== "futures" ||
                    item.contractType === "PERPETUAL" ||
                    !item.contractType)
            );

            datalist.replaceChildren();

            for (const item of symbols) {
                const option = document.createElement("option");
                option.value = item.symbol;
                option.label = `${item.baseAsset} / ${item.quoteAsset}`;
                datalist.appendChild(option);
            }

            document.getElementById("rate-note").textContent =
                `${market.toUpperCase()} · ${symbols.length} trading pairs loaded`;

            updateRateMonitor();
        }

        document.getElementById("mydata-market")
            .addEventListener("change", async () => {
                rateMonitor.weight = null;
                rateMonitor.weightLimit = null;

                updateRateMonitor();

                await loadMarketInfo(
                    document.getElementById("mydata-market").value
                );

                fetchMyData();
            });

        function updateRateMonitor() {
            const now = Date.now();

            rateMonitor.requests = rateMonitor.requests.filter(
                time => now - time < 60000
            );

            const percent = rateMonitor.weightLimit && rateMonitor.weight !== null
                ? Number(rateMonitor.weight) /
                rateMonitor.weightLimit * 100
                : 0;

            document.getElementById("rate-requests").textContent =
                rateMonitor.requests.length;

            document.getElementById("rate-429").textContent =
                rateMonitor.errors429;

            document.getElementById("rate-418").textContent =
                rateMonitor.errors418;

            document.getElementById("rate-weight").textContent =
                rateMonitor.weightLimit
                    ? `${rateMonitor.weight ?? 0} / ${rateMonitor.weightLimit}`
                    : "N/A";

            document.getElementById("rate-weight-percent").textContent =
                `${percent.toFixed(2)}%`;

            document.getElementById("rate-progress-bar").style.width =
                `${Math.min(percent, 100)}%`;

            document.getElementById("rate-progress-bar").style.background =
                percent >= 80 ? "#ef4444" :
                percent >= 70 ? "#f59e0b" : "#4ade80";

            document.getElementById("rate-cache").textContent =
                rateMonitor.cache;

            document.getElementById("rate-last").textContent =
                rateMonitor.lastRequest;

            document.getElementById("monitor-status").textContent =
                autoRefresh ? "● Monitoring" : "● Paused";
        }

        async function fetchMyData() {
            if (isLoading) return;

            isLoading = true;

            rateMonitor.requests.push(Date.now());
            rateMonitor.lastRequest = new Date().toLocaleTimeString();

            updateRateMonitor();

            try {
                const {
                    data: { session },
                    error
                } = await window.supabaseClient.auth.getSession();

                if (error || !session) {
                    throw new Error("Supabase session олдсонгүй.");
                }

                if (session.user.id !== ADMIN_USER_ID) {
                    throw new Error("MyData эрхгүй account.");
                }

                const symbol = document.getElementById("mydata-symbol")
                    .value.trim().toUpperCase();

                const market = document.getElementById("mydata-market").value;
                const interval = document.getElementById("mydata-interval").value;

                const params = new URLSearchParams({
                    symbol,
                    market,
                    interval,
                    fast: 12,
                    slow: 26,
                    signal: 9,
                    rsiPeriod: 7
                });

                mydataMessage.textContent = "Indicator татаж байна...";

                const response = await fetch(`/api/data1?${params}`, {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        Authorization: `Bearer ${session.access_token}`,
                        apikey: window.SUPABASE_API_KEY
                    }
                });

                // Binance monitor headers
                const weight = response.headers.get(
                    "X-Binance-Used-Weight-1m"
                );

                if (weight !== null) {
                    rateMonitor.weight = weight;
                }

                rateMonitor.cache =
                    response.headers.get("X-MyData-Cache") || "--";

                if (response.status === 429) {
                    rateMonitor.errors429++;
                    mydataMessage.textContent =
                        "Rate Limit! Хүсэлт түр зогсоох шаардлагатай.";
                    throw new Error("HTTP 429: Too many requests");
                }

                if (response.status === 418) {
                    rateMonitor.errors418++;
                    mydataMessage.textContent =
                        "Binance IP Ban илэрлээ.";
                    throw new Error("HTTP 418: IP banned");
                }

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "Өгөгдөл авахад алдаа гарлаа."
                    );
                }

                mydataOutput.textContent = JSON.stringify(
                    result,
                    null,
                    2
                );

                mydataMessage.textContent =
                    "Indicator амжилттай шинэчлэгдлээ.";

            } catch (error) {
                mydataMessage.textContent = error.message;

            } finally {
                isLoading = false;
                updateRateMonitor();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();

            autoRefresh = true;

            refreshTimer = setInterval(
                fetchMyData,
                REFRESH_INTERVAL
            );

            updateRateMonitor();
        }

        function stopAutoRefresh() {
            if (refreshTimer !== null) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }

            autoRefresh = false;
            updateRateMonitor();
        }

        mydataForm.addEventListener("submit", async event => {
            event.preventDefault();

            if (autoRefresh) {
                stopAutoRefresh();

                mydataMessage.textContent =
                    "Auto Refresh унтарлаа.";

            } else {
                await loadMarketInfo(
                    document.getElementById("mydata-market").value
                );

                await fetchMyData();
                startAutoRefresh();
            }

            mydataForm.querySelector(
                "button[type='submit']"
            ).textContent = autoRefresh
                ? "Auto Refresh унтраах"
                : "Auto Refresh асаах";
        });

        window.addEventListener("beforeunload", stopAutoRefresh);

        (async function initializeMyData() {
            try {
                const {
                    data: { session }
                } = await window.supabaseClient.auth.getSession();

                if (!session) {
                    mydataMessage.textContent =
                        "Эхлээд нэвтэрнэ үү.";
                    return;
                }

                if (session.user.id !== ADMIN_USER_ID) {
                    mydataMessage.textContent =
                        "MyData эрхгүй account.";
                    return;
                }

                await fetchMyData();

                startAutoRefresh();

                mydataForm.querySelector(
                    "button[type='submit']"
                ).textContent = "Auto Refresh унтраах";

            } catch (error) {
                mydataMessage.textContent = error.message;
            }
        })();

        // Request counter-ийг минут тутам шинэчилнэ.
        setInterval(updateRateMonitor, 1000);




    </script>
    <script src="/static/js/footer.js"></script>
</body>
</html>
